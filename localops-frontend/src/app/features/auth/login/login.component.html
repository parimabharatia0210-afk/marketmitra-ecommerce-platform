<div class="page-wrapper">
  <div class="navbar">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span>MarketMitra</span>
    </div>
    <a routerLink="/" class="back-btn">← Back</a>
  </div>

  <div class="login-card">
    <h2>Admin Login</h2>
    <p class="subtitle">Enter your credentials to continue</p>

    <div class="field-error" *ngIf="error" style="text-align: center; margin-bottom: 10px; font-size: 14px;">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="your@email.com">
        <span class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Min 6 characters">
        <span class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password required (min 6 characters)
        </span>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <p class="register-link">
        Buyer? <a routerLink="/buyer-login">Buyer Login</a> or <a routerLink="/register">Register</a>
      </p>
    </form>
  </div>
</div>
