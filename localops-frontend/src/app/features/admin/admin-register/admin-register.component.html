<div class="page-wrapper">
  <div class="navbar">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span>MarketMitra Admin</span>
    </div>
    <a routerLink="/admin" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="register-card">
    <h2>Add New Admin</h2>
    <p class="subtitle">Create an account for a new administrator.</p>

    <div class="alert success-alert" *ngIf="success">{{ success }}</div>
    <div class="alert error-alert" *ngIf="error">{{ error }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" placeholder="Admin Name">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="admin@marketmitra.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Min 6 characters">
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Adding...' : 'Add Admin' }}
      </button>
    </form>
  </div>
</div>
