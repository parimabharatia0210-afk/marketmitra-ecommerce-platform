<div class="login-page">
  <!-- Background grid -->
  <div class="grid-bg"></div>

  <!-- Glow orb -->
  <div class="glow-orb"></div>

  <div class="login-card">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12l10 5 10-5" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-name">MarketMitra</h1>
        <p class="brand-sub">Admin Control Panel</p>
      </div>
    </div>

    <div class="divider"></div>

    <div class="error-box" *ngIf="error">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10" stroke="#ef4444" stroke-width="2" fill="none"/><line x1="12" y1="8" x2="12" y2="12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="#ef4444"/></svg>
      {{ error }}
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="field">
        <label>Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#64748b" stroke-width="2" fill="none"/><polyline points="22,6 12,13 2,6" stroke="#64748b" stroke-width="2" fill="none"/></svg>
          <input type="email" [(ngModel)]="email" name="email" placeholder="admin@marketmitra.com" required autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2" stroke="#64748b" stroke-width="2" fill="none"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#64748b" stroke-width="2" fill="none"/></svg>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="#64748b" stroke-width="2" fill="none"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" [disabled]="loading">
        <span *ngIf="!loading">Sign In to Dashboard</span>
        <span *ngIf="loading" class="spinner-wrap">
          <svg class="spinner" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" stroke="#020617" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10" fill="none"/></svg>
          Authenticating...
        </span>
      </button>
    </form>

    <p class="footer-note">MarketMitra &copy; 2024 · Admin Access Only</p>
  </div>
</div>
