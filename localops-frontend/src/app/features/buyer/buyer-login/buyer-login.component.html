<div class="page-wrapper">
  <div class="navbar">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span>MarketMitra</span>
    </div>
    <a routerLink="/" class="back-btn">← Back</a>
  </div>

  <div class="login-card">
    <h2>Buyer Login</h2>
    <p class="subtitle">Enter your credentials to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="your@email.com">
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Enter valid email
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Password">
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password required
        </small>
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>

      <p class="error">{{ errorMessage }}</p>

      <p class="register-link">
        Don't have an account?
        <a routerLink="/register">Register as Buyer</a>
      </p>
    </form>
  </div>
</div>
